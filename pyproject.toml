[project]
name = "contrast"
version = "0.1.0"
description = "Reproducible supervised contrastive learning experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pyarrow>=20,<24",
    "pydantic>=2.11,<3",
    "schedulefree>=1.4,<2",
    "torch>=2.7,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
contrast = "contrast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contrast"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
